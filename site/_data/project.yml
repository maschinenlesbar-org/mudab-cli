# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Ein kleiner, schlanker **TypeScript-Client mit CLI** für die REST-API der **MUDAB**
    (Meeresumweltdatenbank): Daten des Meeresmonitorings der Küstenländer und
    Forschungseinrichtungen, bereitgestellt von der Bundesanstalt für Gewässerkunde (BfG) und
    veröffentlicht vom Umweltbundesamt (UBA). Eine [bund.dev](https://bund.dev)-API.
